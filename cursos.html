<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>Cursos</h1>
    <nav id="nav"></nav>
  </header>

  <div class="form-container">
    <h2 id="tituloForm">Nuevo curso</h2>
    <form id="cursoForm">
      <div class="form-group">
        <label for="anio">Año:</label>
        <select id="anio" required>
          <option value="">Seleccione</option>
          <option value="1">1°</option>
          <option value="2">2°</option>
          <option value="3">3°</option>
          <option value="4">4°</option>
        </select>
      </div>
      <div class="form-group">
        <label for="division">División:</label>
        <input id="division" maxlength="5" placeholder="Ej: A" required>
      </div>
      <div class="form-group">
        <label for="carrera">Carrera:</label>
        <input id="carrera" list="carreras" placeholder="Ej: Desarrollo de Software" required>
        <datalist id="carreras"></datalist>
      </div>
      <button type="submit" id="guardarBtn">Guardar curso</button>
      <button type="button" id="cancelarBtn" class="btn-gris" style="display:none">Cancelar edición</button>
    </form>
  </div>

  <div class="estudiantes-registrados">
    <h2>Cursos cargados</h2>
    <div id="listaCursos"></div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/cursos.js"></script>
</body>
</html>
