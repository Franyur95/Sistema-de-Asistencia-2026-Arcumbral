<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial de Asistencia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <header><h1>Historial de Asistencia</h1><nav id="nav"></nav></header>

  <div class="filtros">
    <div><label for="filtroMateria">Materia:</label><select id="filtroMateria"></select></div>
    <div><label for="desde">Desde:</label><input type="date" id="desde"></div>
    <div><label for="hasta">Hasta:</label><input type="date" id="hasta"></div>
    <div><label for="filtroEstudiante">Estudiante:</label><input id="filtroEstudiante" placeholder="Código o nombre"></div>
    <div>
      <button id="aplicarFiltros">Filtrar</button>
      <button id="exportarBtn" class="btn-verde">CSV</button>
      <button id="pdfBtn" class="btn-rojo">PDF</button>
    </div>
  </div>

  <div class="historial-container">
    <h2>Registros</h2>
    <div id="tablaHistorial" style="overflow-x:auto"></div>
  </div>
</div>
<script src="js/db.js"></script>
<script src="js/historial.js"></script>
</body>
</html>
