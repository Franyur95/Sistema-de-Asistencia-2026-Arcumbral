<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alumnos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <header><h1>Alumnos</h1><nav id="nav"></nav></header>

  <div class="form-container">
    <h2 id="tituloForm">Nuevo alumno</h2>
    <form id="registroForm">
      <div class="form-group"><label for="codigo">Código (DNI o legajo, solo letras y números):</label><input id="codigo" maxlength="20" required></div>
      <div class="form-group"><label for="nombre">Nombre Completo:</label><input id="nombre" required></div>
      <div class="form-group"><label for="carrera">Carrera:</label><select id="carrera" required></select></div>
      <div class="form-group"><label for="curso">Curso:</label><select id="curso" required></select></div>
      <div class="form-group"><label for="mac">MAC del celular (opcional, para WiFi automático):</label>
        <input id="mac" placeholder="AA:BB:CC:DD:EE:FF" maxlength="17"></div>
      <button type="submit" id="guardarBtn">Registrar alumno</button>
      <button type="button" id="cancelarBtn" class="btn-gris" style="display:none">Cancelar edición</button>
    </form>
  </div>

  <div class="estudiantes-registrados">
    <h2>Alumnos registrados</h2>
    <div id="listaEstudiantes"></div>
  </div>
</div>
<script src="js/db.js"></script>
<script src="js/registro.js"></script>
</body>
</html>
