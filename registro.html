<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Estudiantes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>Registro de Estudiantes</h1>
    <nav><a href="index.html">Inicio</a><a href="asistencia.html">Tomar Asistencia</a><a href="historial.html">Historial</a></nav>
  </header>

  <div class="form-container">
    <h2>Datos del Estudiante</h2>
    <form id="registroForm">
      <div class="form-group"><label for="codigo">Código de Estudiante (DNI o legajo):</label><input id="codigo" required></div>
      <div class="form-group"><label for="nombre">Nombre Completo:</label><input id="nombre" required></div>
      <div class="form-group"><label for="email">Email:</label><input type="email" id="email" required></div>
      <div class="form-group"><label for="curso">Curso:</label><select id="curso" required></select></div>

      <details class="form-group">
        <summary><strong>Rostro (opcional, para reconocimiento facial)</strong></summary>
        <div class="video-box" style="margin-top:10px"><video id="video" class="espejo" muted playsinline></video></div>
        <p id="faceMsg" style="text-align:center"></p>
        <div style="text-align:center">
          <button type="button" id="activarCamara" class="btn-gris">Activar cámara</button>
          <button type="button" id="capturarBtn" class="btn-verde" disabled>Capturar rostro</button>
        </div>
      </details>

      <button type="submit">Registrar Estudiante</button>
    </form>
    <div id="qrResultado"></div>
  </div>

  <div class="estudiantes-registrados">
    <h2>Estudiantes Registrados</h2>
    <div id="listaEstudiantes"></div>
  </div>
</div>

<script src="js/qrcode.js"></script>
<script src="js/face-api.min.js"></script>
<script src="js/db.js"></script>
<script src="js/registro.js"></script>
</body>
</html>
